<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/hidden — restricted channel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0a0c0e;
    --amber:#ffb400;
    --red:#e10600;
    --steel:#7a8790;
  }
  html,body{
    margin:0; height:100%;
    background:var(--asphalt);
    font-family:'IBM Plex Mono',monospace;
    color:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vw;
  }
  .panel{
    max-width:640px;
    border:1px solid rgba(255,180,0,0.3);
    padding:44px 36px;
    border-radius:4px;
    background:rgba(255,180,0,0.03);
  }
  .flag{
    font-size:0.72rem;
    letter-spacing:0.2em;
    color:var(--red);
    margin-bottom:22px;
  }
  .flag::before{content:"⚠ ";}
  p.msg{
    font-size:1.15rem;
    line-height:1.7;
    color:var(--amber);
    margin:0 0 26px;
  }
  .cursor{
    display:inline-block;
    width:9px; height:1.1em;
    background:var(--amber);
    vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .path{
    font-size:0.72rem;
    color:var(--steel);
    letter-spacing:0.08em;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="flag">RESTRICTED TELEMETRY CHANNEL</div>
    <p class="msg">The latest attack might be your destination<span class="cursor"></span></p>
    <div class="path">/hidden — excluded via robots.txt</div>
  </div>
</body>
</html>
